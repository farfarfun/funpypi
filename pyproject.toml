[project]
name = "funpypi"
version = "0.2.2"
description = "funfarfun 组织内部打包发布辅助工具"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = ["farlog>=1.1.7", "funshell>=1.0.19", "setuptools>=68.0"]

[project.scripts]
funpypi = "funpypi.script:funpypi"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funpypi"]
